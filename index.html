: responde '¿cuánto cuesta un trasplante?', '¿es rentable la UCI Neonatal?', '¿dónde reducir sin afectar calidad?'. Frase clave: la financiera REPORTA; la de costos DECIDE. Ambas son complementarias."}, {"id": 87, "module": "Módulo 8 – Criterio profesional, estrategia e institucional Somer", "question": "¿Cuál es la diferencia entre COSTO y GASTO en la Clínica Somer?", "options": {"A": "El costo siempre es mayor en valor absoluto que el gasto", "B": "El costo está asociado a prestar el servicio asistencial (Clase 6); el gasto a la administración general (Clase 5)", "C": "El gasto se registra en la Clase 6 del PUC para IPS", "D": "Solo los gastos aparecen en el estado de resultados de la Clínica Somer"}, "correct": "B", "justification": "Costo: inversión ligada al servicio asistencial → medicamentos, instrumentadores, honorarios médicos → Clase 6 PUC. Gasto: erogación para administración general → publicidad, asesoría jurídica, nómina administrativa → Clase 5 PUC. Diferenciarlos es fundamental para el análisis de rentabilidad por servicio."}, {"id": 88, "module": "Módulo 8 – Criterio profesional, estrategia e institucional Somer", "question": "¿Qué es el costeo ABC y por qué es relevante para la Clínica Somer?", "options": {"A": "Un sistema que distribuye costos fijos por igual entre UCI, oncología y cirugía", "B": "Un método que asigna costos indirectos según el consumo real de actividades, permitiendo conocer el costo verdadero de servicios como trasplante o ECMO", "C": "Un modelo de presupuestación aplicable solo en hospitales públicos", "D": "Una herramienta para calcular el EBITDA anual consolidado"}, "correct": "B", "justification": "El ABC asigna CIF según actividades que realmente consumen recursos. Para la Clínica Somer, permite saber exactamente cuánto cuesta un trasplante renal vs. una cirugía laparoscópica ambulatoria, evitando subsidios cruzados y fijando tarifas justas. Sus 4 etapas: identificar actividades → asignar costos → definir inductores → asignar a servicios."}, {"id": 89, "module": "Módulo 8 – Criterio profesional, estrategia e institucional Somer", "question": "¿Cuáles son las cuentas PUC más relevantes para el Analista de Costos de la Clínica Somer?", "options": {"A": "Clase 1 (activos) y Clase 2 (pasivos)", "B": "Clase 6 (costos: 6205, 6210, 6215, 6250) y Clase 5 (gastos: 5105, 5120, 5195)", "C": "Clase 3 (deudores) y Clase 4 (ingresos)", "D": "Solo la Clase 6, porque los gastos no son responsabilidad del área de costos"}, "correct": "B", "justification": "Clase 6 (costos): 6205 Personal asistencial, 6210 Honorarios médicos, 6215 Medicamentos e insumos, 6250 Depreciación equipos médicos. Clase 5 (gastos): 5105 Personal administrativo, 5120 Honorarios externos, 5195 Gastos diversos. El analista debe dominar ambas clases para diferenciar costos y gastos en el análisis de rentabilidad."}, {"id": 90, "module": "Módulo 8 – Criterio profesional, estrategia e institucional Somer", "question": "¿Qué método de costeo implementaría en la Clínica Somer y cómo?", "options": {"A": "Costeo variable únicamente; los CIF no son relevantes en alta complejidad", "B": "ABC complementado con centros de costo, por fases: primero centros de costo, luego ABC pleno o Time-Driven ABC", "C": "Costeo tradicional igualitario, por su facilidad y aceptación por la Supersalud", "D": "Costeo absorbente simple, porque la Clínica Somer tiene pocos servicios distintos"}, "correct": "B", "justification": "Para la Somer (trasplantes, ECMO, oncología, UCI múltiple), el ABC por fases es lo más indicado: (1) Los CIF son altísimos y no deben distribuirse arbitrariamente, (2) Fase 1: centros de costo (UCI Adultos, Pediátrica, Neonatal, Oncología, Trasplantes), Fase 2: ABC pleno o Time-Driven ABC. Implementación gradual reduce resistencia y valida inductores."}, {"id": 91, "module": "Módulo 8 – Criterio profesional, estrategia e institucional Somer", "question": "¿Cuáles son tres diferencias clave entre el Manual ISS y el SOAT relevantes para la Clínica Somer?", "options": {"A": "Ámbito (SGSSS vs. accidentes de tránsito), financiación (UPC/ADRES vs. aseguradoras/FONSAT), tarifas (valores relativos CUPS vs. tarifario propio con valores absolutos)", "B": "Ámbito (alta vs. baja complejidad), financiación (EPS vs. gobierno) y tarifas (mayor vs. menor en ISS)", "C": "Solo difieren en las tarifas; el ámbito y la financiación son iguales", "D": "El SOAT cubre todas las urgencias; el ISS solo hospitalización programada"}, "correct": "A", "justification": "Las 3 diferencias: (1) ÁMBITO: ISS para SGSSS con EPS; SOAT para víctimas de accidentes de tránsito. (2) FINANCIACIÓN: ISS con UPC girada por ADRES; SOAT con aseguradoras y FONSAT. (3) TARIFAS: ISS usa valores relativos por CUPS; SOAT usa tarifario propio con valores absolutos, históricamente más altas. La ubicación de la Somer cerca del aeropuerto JMC hace relevante el SOAT."}, {"id": 92, "module": "Módulo 8 – Criterio profesional, estrategia e institucional Somer", "question": "¿Con cuál manual tarifario es más conveniente trabajar y cuál es la estrategia óptima para la Clínica Somer?", "options": {"A": "Exclusivamente con SOAT, por sus tarifas absolutas más altas", "B": "Exclusivamente con EPS bajo manual ISS, por el volumen continuo garantizado", "C": "Un mix: contratos ISS con EPS del Oriente Antioqueño + habilitación SOAT por la cercanía al aeropuerto y alta circulación vial", "D": "Solo con particulares y prepagadas para maximizar el margen por procedimiento"}, "correct": "C", "justification": "La estrategia óptima para la Clínica Somer es el mix: contratos ISS con EPS garantizan volumen continuo y predecible para sus servicios de alta complejidad; la habilitación SOAT es especialmente valiosa dada la proximidad al Aeropuerto Internacional José María Córdova y la alta circulación vial de Rionegro, con tarifas más altas por evento."}, {"id": 93, "module": "Módulo 8 – Criterio profesional, estrategia e institucional Somer", "question": "¿Cuáles son los tres elementos del costo en los servicios de la Clínica Somer?", "options": {"A": "Ingresos EPS, ingresos particulares y costos fijos", "B": "Materia prima directa (insumos/medicamentos), mano de obra directa (personal asistencial) y CIF (depreciación, esterilización, servicios públicos asistenciales)", "C": "Costos fijos, variables y semifijos de cada sede", "D": "Activos fijos, activos corrientes y pasivos de la clínica"}, "correct": "B", "justification": "(1) Materia prima directa: medicamentos, kits de trasplante, reactivos, dispositivos implantados. (2) Mano de obra directa: médicos intensivistas, cirujanos, enfermeras, instrumentadores, terapeutas. (3) CIF: depreciación de equipos de alta tecnología (ECMO, tomógrafo, RM), esterilización, servicios públicos asistenciales. Su suma = costo total del servicio."}, {"id": 94, "module": "Módulo 8 – Criterio profesional, estrategia e institucional Somer", "question": "La Clínica Somer fue fundada en 1985 y en su visión al 2028 aspira a ser 'organización de salud sostenible centrada en las personas'. Para el área de costos, 'sostenible' implica principalmente:", "options": {"A": "Maximizar la rentabilidad a corto plazo eliminando servicios de baja rentabilidad", "B": "Generar información de costos que permita resultados de excelencia clínica con viabilidad financiera de largo plazo", "C": "Reducir el personal asistencial para mejorar los márgenes operativos", "D": "Depender exclusivamente de contratos con EPS para garantizar el flujo de caja"}, "correct": "B", "justification": "'Sostenible' en la visión de la Clínica Somer significa equilibrar excelencia clínica con viabilidad financiera de largo plazo. Para el área de costos implica: generar información precisa para decisiones estratégicas, identificar servicios con valor clínico y económico demostrado, gestionar eficientemente los recursos de alta tecnología y mantener capacidad de inversión en innovación."}, {"id": 95, "module": "Módulo 8 – Criterio profesional, estrategia e institucional Somer", "question": "La Clínica Somer tiene la 2.ª Unidad Funcional de Cáncer del país con Sello de Sostenibilidad. ¿Qué desafío específico plantea para el Analista de Costos?", "options": {"A": "Ninguno especial; se costea igual que una consulta general", "B": "Alto costo de medicamentos oncológicos (muchos NO PBS vía MIPRES), equipos de alta tecnología, personal especializado y ciclos de tratamiento prolongados", "C": "Solo aplica el manual SOAT para los pacientes oncológicos del Oriente Antioqueño", "D": "El Sello de Sostenibilidad exime a esta unidad de cumplir con el PUC"}, "correct": "B", "justification": "La Unidad Funcional de Cáncer plantea desafíos únicos: medicamentos oncológicos costosos (muchos fuera del PBS tramitados por MIPRES), equipos de alta tecnología con alta depreciación, personal altamente especializado, ciclos de tratamiento prolongados y negociación especial con EPS para tecnologías de alto costo. El ABC es esencial para costear correctamente cada protocolo oncológico."}, {"id": 96, "module": "Módulo 8 – Criterio profesional, estrategia e institucional Somer", "question": "La Clínica Somer opera con 5 sedes en Rionegro y el Oriente Antioqueño. ¿Qué implica esto para la estructura de costos y el análisis financiero?", "options": {"A": "No implica diferencia; todos los costos se consolidan en un único centro de costo", "B": "Cada sede debe tener sus propios centros de costo, permitiendo analizar la rentabilidad por sede y tomar decisiones de optimización de recursos entre ellas", "C": "Solo la sede principal genera costos; las demás solo generan ingresos", "D": "Las sedes ambulatorias no requieren análisis de costos porque son de baja complejidad"}, "correct": "B", "justification": "La operación multisede (Principal, Ambulatoria, Jardines Llanogrande, City Médica, Rionegro Plaza) requiere centros de costo por sede para: analizar la rentabilidad individual, asignar correctamente los costos fijos compartidos (sistemas, administración central), identificar qué servicios son rentables en cada sede y tomar decisiones de expansión o consolidación."}, {"id": 97, "module": "Módulo 8 – Criterio profesional, estrategia e institucional Somer", "question": "La misión de la Clínica Somer es 'Corazón y excelencia al servicio de tu bienestar'. Para el área de costos, 'excelencia' financiera se traduce en:", "options": {"A": "Reducir costos sin importar el impacto en los resultados clínicos", "B": "Generar información oportuna, precisa y accionable que permita mantener la calidad asistencial con sostenibilidad financiera", "C": "Maximizar los ingresos de pacientes particulares eliminando contratos con EPS", "D": "Implementar el sistema de costeo más sencillo para agilizar los reportes mensuales"}, "correct": "B", "justification": "La excelencia financiera en la Clínica Somer significa que el área de costos genera información oportuna, precisa y accionable: costos reales por procedimiento y servicio, análisis de desviaciones presupuestales, indicadores de gestión actualizados y recomendaciones para negociación con EPS. Esto permite mantener la excelencia clínica con sostenibilidad, cumpliendo la misión institucional."}, {"id": 98, "module": "Módulo 8 – Criterio profesional, estrategia e institucional Somer", "question": "¿Cuál es el indicador más crítico a monitorear semanalmente para el Analista de Costos de la Clínica Somer?", "options": {"A": "El EBITDA trimestral consolidado de todas las sedes", "B": "El índice ocupacional anual promedio de las UCI", "C": "El flujo de caja operativo y los días de cartera con EPS, dado el alto costo de insumos de alta complejidad", "D": "La tasa de depreciación de los equipos de imagenología y cirugía"}, "correct": "C", "justification": "El flujo de caja operativo y los días de cartera son los indicadores más críticos para monitoreo frecuente: los insumos de alta complejidad se pagan en 30–60 días, las EPS en 90+ días, y una ruptura de caja compromete la operación de servicios críticos (UCI, trasplantes, banco de sangre). El EBITDA es trimestral; el IO es estable; la depreciación es periódica."}, {"id": 99, "module": "Módulo 8 – Criterio profesional, estrategia e institucional Somer", "question": "Como referente regional del Oriente Antioqueño, la Clínica Somer recibe pacientes remitidos de municipios cercanos. ¿Qué implicación tiene esto para el costeo?", "options": {"A": "No tiene implicación especial; el costeo es igual sin importar el origen del paciente", "B": "Los pacientes remitidos de mayor complejidad generan mayor consumo de actividades (UCI, quirófano, banco de sangre), que el ABC asigna con precisión y el costeo tradicional distorsiona", "C": "Los pacientes remitidos se costean exclusivamente con el manual SOAT", "D": "El costo de remisión no forma parte del costo de prestación del servicio"}, "correct": "B", "justification": "Como referente regional, la Clínica Somer recibe los casos más complejos del Oriente Antioqueño. Estos pacientes consumen más UCI, más horas de quirófano, más unidades del banco de sangre, más medicamentos de alto costo. El ABC asigna estos costos con precisión según el consumo real, mientras el costeo tradicional los mezcla con casos de menor complejidad, distorsionando la rentabilidad."}, {"id": 100, "module": "Módulo 8 – Criterio profesional, estrategia e institucional Somer", "question": "Al presentarse a este proceso de selección para Analista de Costos de la Clínica Somer, proponer implementar el ABC 'por fases, iniciando con centros de costo y avanzando hacia Time-Driven ABC' demuestra:", "options": {"A": "Desconocimiento del ABC, ya que debe implementarse todo de una vez para ser efectivo", "B": "Madurez profesional: reconoce la complejidad organizativa de la Somer, la necesidad de cambio cultural y la conveniencia de demostrar valor antes de comprometer la organización completa", "C": "Preferencia por el costeo tradicional sobre el ABC", "D": "Falta de decisión para comprometerse con un método específico de costeo"}, "correct": "B", "justification": "Proponer implementación por fases demuestra: (1) conocimiento del ABC y sus variantes (Time-Driven ABC), (2) comprensión de la complejidad de una institución con 5 sedes y múltiples servicios de alta complejidad, (3) visión práctica sobre el cambio organizacional (adaptación del equipo, ajuste de sistemas Dinámica Web Somer, validación de inductores), y (4) madurez para priorizar resultados sostenibles."}, {"id": 101, "module": "Módulo 9 – Análisis financiero y estados financieros", "question": "¿Cuál es el orden correcto de presentación del Estado de Resultados de la Clínica Somer bajo NIIF?", "options": {"A": "Gastos operacionales → Ingresos → Utilidad bruta → Costos", "B": "Ingresos operacionales → Costos de prestación → Utilidad bruta → Gastos operacionales → Utilidad operacional", "C": "Patrimonio → Ingresos → Gastos → Utilidad del período", "D": "Costos directos → Gastos administrativos → Ingresos → Utilidad neta"}, "correct": "B", "justification": "El Estado de Resultados bajo NIIF sigue la estructura: Ingresos operacionales − Costos de prestación de servicios (Clase 6) = Utilidad bruta − Gastos operacionales (Clase 5) = Utilidad operacional ± Ingresos y gastos no operacionales = Utilidad antes de impuestos − Impuesto de renta = Utilidad neta del período. Esta secuencia permite identificar el desempeño en cada nivel de la operación de la Clínica Somer."}, {"id": 102, "module": "Módulo 9 – Análisis financiero y estados financieros", "question": "La Clínica Somer presenta activos corrientes por $3.200 millones y pasivos corrientes por $1.800 millones. ¿Cuál es el capital de trabajo neto?", "options": {"A": "$5.000 millones", "B": "$1.800 millones", "C": "$1.400 millones", "D": "$3.200 millones"}, "correct": "C", "justification": "Capital de trabajo neto = Activos corrientes − Pasivos corrientes = $3.200M − $1.800M = $1.400M. Un capital de trabajo positivo indica que la Clínica Somer puede cubrir sus obligaciones de corto plazo (nómina, proveedores, cuotas) con sus activos líquidos disponibles. Este indicador es crítico en el sector salud, donde las EPS pueden demorar el pago de cartera entre 60 y 120 días."}, {"id": 103, "module": "Módulo 9 – Análisis financiero y estados financieros", "question": "¿Qué mide el EBITDA en el contexto financiero de la Clínica Somer?", "options": {"A": "La utilidad neta disponible para distribuir a los accionistas después de impuestos", "B": "El total de ingresos facturados a EPS e IPS en el período", "C": "La capacidad operativa de generar caja antes de intereses, impuestos, depreciación y amortización", "D": "El margen bruto de la Clínica antes de descontar gastos administrativos"}, "correct": "C", "justification": "EBITDA (Earnings Before Interest, Taxes, Depreciation and Amortization) mide la generación de caja operativa pura, excluyendo efectos financieros y contables. En la Clínica Somer es especialmente útil porque la inversión en equipos de alta complejidad (TAC, resonancia, ECMO) genera depreciaciones elevadas que reducen la utilidad contable sin salida de efectivo. Un EBITDA positivo y creciente indica que la operación asistencial es autosostenible."}, {"id": 104, "module": "Módulo 9 – Análisis financiero y estados financieros", "question": "Los ingresos operacionales de la Clínica Somer son $9.500 millones y los costos de prestación de servicios suman $6.840 millones. ¿Cuál es el margen bruto?", "options": {"A": "72,0%", "B": "28,0%", "C": "43,5%", "D": "56,5%"}, "correct": "B", "justification": "Margen bruto = (Ingresos − Costos de prestación) / Ingresos × 100 = (9.500 − 6.840) / 9.500 × 100 = 2.660 / 9.500 × 100 = 28,0%. Este indicador muestra qué porcentaje de los ingresos queda después de cubrir los costos asistenciales directos. En IPS de alta complejidad como la Clínica Somer, un margen bruto del 25–35% es razonable, dado el peso de insumos, tecnología y personal especializado."}, {"id": 105, "module": "Módulo 9 – Análisis financiero y estados financieros", "question": "La Clínica Somer tiene activos corrientes de $4.500 millones y pasivos corrientes de $2.500 millones. ¿Cuál es la razón corriente?", "options": {"A": "0,56 — la clínica no puede cubrir sus deudas de corto plazo", "B": "2,00 — por cada peso de deuda corriente hay $2 de activo corriente", "C": "1,80 — por cada peso de deuda corriente hay $1,80 de activo corriente", "D": "$7.000 millones — diferencia entre activos y pasivos corrientes"}, "correct": "C", "justification": "Razón corriente = Activos corrientes / Pasivos corrientes = 4.500 / 2.500 = 1,80. Significa que por cada $1 de deuda a corto plazo, la Clínica Somer dispone de $1,80 en activos líquidos. Una razón entre 1,5 y 2,5 se considera saludable para el sector salud. Por debajo de 1 indica riesgo de iliquidez; muy por encima puede señalar activos ociosos como cartera sin recuperar o inventarios excesivos."}, {"id": 106, "module": "Módulo 9 – Análisis financiero y estados financieros", "question": "Las cesantías, prima de servicios y vacaciones causadas del personal asistencial de la Clínica Somer se clasifican contablemente como:", "options": {"A": "Gastos del período en la Clase 5 del PUC", "B": "Activos diferidos en la Clase 1 del PUC", "C": "Pasivos corrientes en la Clase 2 del PUC (obligaciones laborales)", "D": "Ingresos diferidos en la Clase 4 del PUC"}, "correct": "C", "justification": "Las prestaciones sociales causadas (cesantías, intereses sobre cesantías, prima y vacaciones) son obligaciones de la Clínica Somer con sus empleados que se acumulan a medida que se prestan los servicios. Se registran como pasivos corrientes en la Clase 2 del PUC (cuentas 2610, 2620, 2630) porque representan compromisos ciertos de corto plazo. Su contrapartida es un débito en la Clase 6 (costos de personal asistencial) o Clase 5 (personal administrativo)."}, {"id": 107, "module": "Módulo 9 – Análisis financiero y estados financieros", "question": "¿Cuál de los siguientes conceptos reduce la utilidad neta de la Clínica Somer pero NO implica una salida de efectivo en el mismo período?", "options": {"A": "Pago de salarios del personal de la UCI Adultos", "B": "Compra de medicamentos oncológicos al contado", "C": "Depreciación del equipo de resonancia magnética", "D": "Pago de servicios públicos de la sede principal"}, "correct": "C", "justification": "La depreciación es un gasto contable que distribuye el costo del equipo a lo largo de su vida útil, reduciendo la utilidad del período. Sin embargo, la salida de efectivo ocurrió al comprar el equipo; en períodos posteriores, la depreciación es solo un apunte contable sin movimiento de caja. Por eso, en el Estado de Flujo de Efectivo (método indirecto), se suma de nuevo a la utilidad neta para calcular el flujo operativo real. Los otros tres conceptos sí representan salidas de efectivo reales."}, {"id": 108, "module": "Módulo 9 – Análisis financiero y estados financieros", "question": "Salud Total EPS paga una factura de $250.000.000 a la Clínica Somer y le practica retención en la fuente a título de renta del 2%. ¿Cuánto recibe efectivamente la Clínica en su cuenta bancaria?", "options": {"A": "$255.000.000", "B": "$245.000.000", "C": "$200.000.000", "D": "$248.000.000"}, "correct": "B", "justification": "Retención en la fuente = $250.000.000 × 2% = $5.000.000. Valor neto recibido = $250.000.000 − $5.000.000 = $245.000.000. La EPS actúa como agente retenedor y entrega los $5.000.000 directamente a la DIAN como anticipo del impuesto de renta de la Clínica Somer. Este valor queda registrado como un activo (anticipo de impuesto) en el balance y se descuenta de la declaración de renta al cierre del año fiscal."}, {"id": 109, "module": "Módulo 9 – Análisis financiero y estados financieros", "question": "Los ingresos operacionales de la Clínica Somer fueron $8.000 millones en 2023 y $9.360 millones en 2024. ¿Cuál fue la variación porcentual (análisis horizontal)?", "options": {"A": "85,5%", "B": "14,5%", "C": "17,0%", "D": "1.360%"}, "correct": "C", "justification": "Variación % = (Valor año actual − Valor año anterior) / Valor año anterior × 100 = (9.360 − 8.000) / 8.000 × 100 = 1.360 / 8.000 × 100 = 17,0%. El análisis horizontal compara cifras de dos períodos para identificar tendencias. Un crecimiento del 17% en ingresos es positivo, pero debe contrastarse con el crecimiento de los costos y gastos para determinar si mejoró realmente la rentabilidad de la Clínica Somer."}, {"id": 110, "module": "Módulo 9 – Análisis financiero y estados financieros", "question": "La Clínica Somer tiene costos y gastos fijos de $3.000 millones anuales y un margen de contribución del 40% sobre sus ingresos. ¿Cuál es el punto de equilibrio en ingresos?", "options": {"A": "$1.200 millones", "B": "$4.200 millones", "C": "$7.500 millones", "D": "$3.000 millones"}, "correct": "C", "justification": "Punto de equilibrio = Costos fijos / Margen de contribución = $3.000M / 0,40 = $7.500M. Por debajo de $7.500M en ingresos, la Clínica opera con pérdida; por encima, genera utilidad operacional. El margen de contribución del 40% significa que de cada peso ingresado, $0,40 cubre costos fijos y genera ganancia; los $0,60 restantes son costos variables como insumos, medicamentos y mano de obra directa variable."}, {"id": 111, "module": "Módulo 9 – Análisis financiero y estados financieros", "question": "La Clínica Somer tiene ingresos anuales de $10.800 millones y saldo de cuentas por cobrar de $2.700 millones. ¿Cuántos días tarda en promedio en recuperar su cartera?", "options": {"A": "25 días", "B": "40 días", "C": "91 días", "D": "120 días"}, "correct": "C", "justification": "Días de cartera = (Cuentas por cobrar / Ingresos) × 365 = (2.700 / 10.800) × 365 = 0,25 × 365 = 91 días. En el sector salud colombiano, plazos de 60–90 días son frecuentes por los ciclos de radicación, auditoría y pago de las EPS. Un indicador superior a 120 días puede comprometer la liquidez de la Clínica, obligándola a financiarse con deuda costosa mientras espera el recaudo."}, {"id": 112, "module": "Módulo 9 – Análisis financiero y estados financieros", "question": "Bajo NIIF (NIC 16), los equipos médicos de alta complejidad de la Clínica Somer pueden medirse posteriormente por:", "options": {"A": "Únicamente al costo histórico original, sin ajustes posteriores", "B": "Valor de mercado actualizado mensualmente de forma obligatoria", "C": "Modelo del costo (costo − depreciación acumulada − deterioro) O modelo de revaluación (valor razonable − depreciación posterior), según política contable de la entidad", "D": "Solo por el valor de reposición del equipo nuevo equivalente"}, "correct": "C", "justification": "La NIC 16 (adoptada en Colombia mediante Decreto 2420 de 2015 para entidades Grupo 1) permite dos modelos de medición posterior: (1) Modelo del costo: costo histórico menos depreciación acumulada y pérdidas por deterioro; (2) Modelo de revaluación: valor razonable a la fecha de revaluación menos depreciación y deterioro posteriores. La Clínica Somer debe elegir y aplicar consistentemente un modelo por clase de activo. El modelo de revaluación puede ser relevante para inmuebles o equipos especializados con mercado activo."}, {"id": 113, "module": "Módulo 9 – Análisis financiero y estados financieros", "question": "¿Cuál de los siguientes eventos modifica el patrimonio de la Clínica Somer?", "options": {"A": "Cobro de cartera a Sura EPS por $80 millones facturados en período anterior", "B": "Compra de medicamentos oncológicos a crédito por $30 millones", "C": "Pago de cuenta por pagar a proveedor de dispositivos médicos", "D": "Distribución de utilidades decretada a los accionistas por $200 millones"}, "correct": "D", "justification": "La distribución de utilidades reduce las utilidades retenidas (componente del patrimonio): Débito Utilidades retenidas / Crédito Dividendos por pagar. Las otras opciones no afectan el patrimonio: (A) cobro de cartera es un intercambio de activos (caja + / cartera −); (B) compra a crédito aumenta activo y pasivo en igual monto; (C) pago de proveedor reduce activo y pasivo en igual monto. En los tres casos la ecuación Activo = Pasivo + Patrimonio se mantiene sin cambiar el patrimonio."}, {"id": 114, "module": "Módulo 9 – Análisis financiero y estados financieros", "question": "En la conciliación bancaria de la Clínica Somer se identifica un cheque girado al proveedor de insumos quirúrgicos por $18 millones que aún no ha sido cobrado en el banco. ¿Cómo se trata en la conciliación?", "options": {"A": "Se suma al saldo del extracto bancario", "B": "Se suma al saldo en libros de la Clínica", "C": "Se resta del saldo del extracto bancario", "D": "No se incluye porque el cheque ya fue registrado en libros"}, "correct": "C", "justification": "Un cheque girado y ya registrado en libros de la Clínica (reduciendo el saldo contable) pero aún no presentado al banco por el beneficiario, no aparece en el extracto bancario. Para conciliar, se resta del saldo bancario: Saldo extracto − Cheques girados no cobrados + Consignaciones en tránsito = Saldo ajustado según libros. Ignorarlo significaría sobreestimar el disponible real en el banco."}, {"id": 115, "module": "Módulo 9 – Análisis financiero y estados financieros", "question": "La Clínica Somer reportó utilidad neta de $560 millones sobre un patrimonio promedio de $3.500 millones. ¿Cuál es el ROE y qué significa?", "options": {"A": "6,25% — la clínica genera $6,25 de utilidad por cada $1 de activo total", "B": "16,0% — por cada $100 de patrimonio, la Clínica genera $16 de utilidad neta", "C": "62,5% — el retorno sobre el activo total de la institución", "D": "0,16% — el margen neto sobre los ingresos operacionales"}, "correct": "B", "justification": "ROE (Return on Equity) = Utilidad neta / Patrimonio promedio × 100 = 560 / 3.500 × 100 = 16,0%. Significa que por cada $100 aportados por los accionistas de la Clínica Somer, se generan $16 de utilidad neta. Un ROE del 16% es sólido en el sector hospitalario colombiano (promedio 8–14%). Este indicador evalúa si la inversión en la Clínica es rentable comparada con alternativas del mercado de capitales."}];

    const MOD_SHORT={
      "Módulo 1 – Costos hospitalarios y clasificación":"Módulo 1",
      "Módulo 2 – Presupuesto y control financiero":"Módulo 2",
      "Módulo 3 – Indicadores de gestión (KPIs)":"Módulo 3",
      "Módulo 4 – Costeo ABC":"Módulo 4",
      "Módulo 5 – Normativa sector salud Colombia":"Módulo 5",
      "Módulo 6 – Contabilidad aplicada a costos":"Módulo 6",
      "Módulo 7 – Caso integral de rentabilidad":"Módulo 7",
      "Módulo 8 – Criterio profesional, estrategia e institucional Somer":"Módulo 8",
      "Módulo 9 – Análisis financiero y estados financieros":"Módulo 9"
    };
    const RANKS=[
      {min:91,label:'Jefe de Costos',icon:'🏆',cls:'r-jef'},
      {min:81,label:'Analista Senior',icon:'⭐',cls:'r-sen'},
      {min:61,label:'Analista de Costos',icon:'✓',cls:'r-ana'},
      {min:41,label:'Analista Junior',icon:'📈',cls:'r-jun'},
      {min:0,label:'Auxiliar de Costos',icon:'📚',cls:'r-aux'},
    ];

    const st={questions:[],currentIdx:0,answers:[],answered:false};
    function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}

    const dpadEl=document.getElementById('dpad');
    function goTo(id){
      document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      window.scrollTo(0,0);
      const on=id==='screen-start';
      catWrap.classList.toggle('cat-on',on);
      catHintEl.classList.toggle('cat-on',on);
      dpadEl.classList.toggle('cat-on',on);
    }

    function startQuiz(){
      const mod=document.getElementById('sel-mod').value;
      let pool=mod==='all'?QUESTIONS:QUESTIONS.filter(q=>q.module===mod);
      st.questions=shuffle(pool);st.currentIdx=0;
      st.answers=new Array(st.questions.length).fill(null);st.answered=false;
      catReset();goTo('screen-quiz');renderQ();
    }

    function renderQ(){
      const q=st.questions[st.currentIdx],n=st.questions.length,i=st.currentIdx;
      const pct=Math.round((i/n)*100);
      const score=st.answers.filter((a,idx)=>a&&st.questions[idx]&&a===st.questions[idx].correct).length;
      document.getElementById('prog-txt').textContent=`Pregunta ${i+1} de ${n}`;
      document.getElementById('prog-pct').textContent=`${pct}%`;
      document.getElementById('prog-fill').style.width=`${pct}%`;
      document.getElementById('sc-val').textContent=score;
      document.getElementById('q-mod').textContent=MOD_SHORT[q.module]||q.module;
      document.getElementById('q-text').textContent=q.question;
      const optsEl=document.getElementById('opts');optsEl.innerHTML='';
      ['A','B','C','D'].forEach(letter=>{
        const btn=document.createElement('button');btn.className='opt';
        btn.innerHTML=`<span class="opt-letter">${letter}</span><span class="opt-txt">${q.options[letter]}</span>`;
        btn.onclick=()=>pick(letter);optsEl.appendChild(btn);
      });
      document.getElementById('just-box').classList.remove('show');
      document.getElementById('btn-next').classList.remove('show');
      st.answered=false;
    }

    function pick(letter){
      if(st.answered)return;st.answered=true;
      const q=st.questions[st.currentIdx];st.answers[st.currentIdx]=letter;
      const isOk=letter===q.correct;
      const score=st.answers.filter((a,i)=>a&&st.questions[i]&&a===st.questions[i].correct).length;
      document.querySelectorAll('.opt').forEach((btn,i)=>{
        const l=['A','B','C','D'][i];btn.setAttribute('disabled','');
        if(l===q.correct)btn.classList.add('correct');
        else if(l===letter)btn.classList.add('wrong');
        else btn.classList.add('dimmed');
      });
      document.getElementById('just-txt').textContent=q.justification;
      document.getElementById('just-box').classList.add('show');
      document.getElementById('sc-val').textContent=score;
      const nb=document.getElementById('btn-next');
      nb.textContent=st.currentIdx<st.questions.length-1?'Siguiente →':'Ver resultados →';
      nb.classList.add('show');
      catReact(isOk?'correct':'wrong');
    }

    function nextQ(){
      if(st.currentIdx<st.questions.length-1){st.currentIdx++;renderQ();document.querySelector('.quiz-body').scrollTop=0;}
      else showResults();
    }

    function showResults(){
      const n=st.questions.length;
      const correct=st.answers.filter((a,i)=>a&&st.questions[i]&&a===st.questions[i].correct).length;
      const pct=Math.round((correct/n)*100);
      const rank=RANKS.find(r=>pct>=r.min);
      document.getElementById('r-score').textContent=correct;
      document.getElementById('r-total').textContent=n;
      document.getElementById('r-pct').textContent=`${pct}% de respuestas correctas`;
      const rb=document.getElementById('rank-badge');
      rb.className=`rank ${rank.cls}`;
      document.getElementById('rank-icon').textContent=rank.icon;
      document.getElementById('rank-name').textContent=rank.label;
      const rev=document.getElementById('review');rev.innerHTML='';
      st.questions.forEach((q,i)=>{
        const ua=st.answers[i],isOk=ua===q.correct;
        const div=document.createElement('div');div.className=`ri ${isOk?'ok':'bad'}`;
        let aH='';
        if(!isOk&&ua)aH+=`<div class="ans-row u-bad"><span class="ans-lbl">Tu resp.</span><span>${ua}) ${q.options[ua]}</span></div>`;
        aH+=`<div class="ans-row ${isOk?'u-ok':'c-ans'}"><span class="ans-lbl">${isOk?'Tu resp.':'Correcta'}</span><span>${q.correct}) ${q.options[q.correct]}</span></div>`;
        div.innerHTML=`<div class="ri-meta"><span class="ri-num">P${i+1}</span><span class="ri-mod">${MOD_SHORT[q.module]||q.module}</span><span class="ri-status ${isOk?'ok':'bad'}">${isOk?'✓ Correcto':'✗ Incorrecto'}</span></div><div class="ri-q">${q.question}</div><div class="ri-ans">${aH}</div><div class="ri-just"><div class="just-mini-lbl">Justificación</div>${q.justification}</div>`;
        rev.appendChild(div);
      });
      goTo('screen-results');
      if(pct>=80)setTimeout(()=>playAnim('jump'),600);
    }

    function resetQuiz(){goTo('screen-start');}

    /* ═══════════════════════════════════
       CAT — sprite2_t.png transparent
       6 frames × 4 rows, 256×256 source
       Display: 128×128  |  bg-size: 768×512
       bgPos(col,row) = -(col*128)px -(row*128)px
    ═══════════════════════════════════ */
    const SZ=128;
    const ROWS={walk:0, jump:1, crouch:2, walkL:3};

    const catWrap=document.getElementById('cat-wrap');
    const catFlip=document.getElementById('cat-flip');
    const catEl=document.getElementById('cat-sprite');
    const catHintEl=document.getElementById('cat-hint');

    function bgPos(col,row){return `${-col*SZ}px ${-row*SZ}px`;}

    const GRAVITY=0.55, JUMP_VY=-13;
    function groundY(){return window.innerHeight-SZ-20;}

    const cs={
      x:0,y:0,velY:0,onGround:true,facing:1,
      animName:'',frame:0,timer:null,
      reacting:false,reactTimer:null
    };

    /* Plays an animation row on loop. Returns the interval id. */
    function playAnim(name){
      clearInterval(cs.timer);
      cs.animName=name;
      cs.frame=0;
      const row=ROWS[name]??0;
      catEl.style.backgroundPosition=bgPos(0,row);
      cs.timer=setInterval(()=>{
        cs.frame=(cs.frame+1)%6;
        catEl.style.backgroundPosition=bgPos(cs.frame,row);
      },120);
    }

    function catReact(type){
      if(cs.reactTimer)clearTimeout(cs.reactTimer);
      cs.reacting=true;
      playAnim(type==='correct'?'jump':'crouch');
      cs.reactTimer=setTimeout(()=>{
        cs.reacting=false;
        playAnim('walk');
      },1800);
    }

    function catReset(){
      cs.x=window.innerWidth-SZ-20;
      cs.y=groundY();
      cs.velY=0;cs.onGround=true;
      cs.facing=1;cs.reacting=false;
      if(cs.reactTimer)clearTimeout(cs.reactTimer);
      catFlip.style.transform='scaleX(1)';
      catWrap.style.left=cs.x+'px';
      catWrap.style.top=cs.y+'px';
      playAnim('walk');
    }

    const keys={};
    document.addEventListener('keydown',e=>{
      if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)){
        e.preventDefault();keys[e.key]=true;
      }
    });
    document.addEventListener('keyup',e=>{keys[e.key]=false;});

    let prevState='idle';
    function catLoop(){
      if(!cs.reacting){
        const spd=3;let dx=0;
        if(keys['ArrowRight']) dx= spd;
        if(keys['ArrowLeft'])  dx=-spd;

        // Jump trigger
        if((keys['ArrowUp']||keys[' '])&&cs.onGround){
          cs.velY=JUMP_VY; cs.onGround=false;
        }

        // Horizontal
        if(dx!==0){
          cs.x=Math.max(0,Math.min(window.innerWidth-SZ,cs.x+dx));
          catWrap.style.left=cs.x+'px';
          if(dx>0&&cs.facing!==1){cs.facing=1;catFlip.style.transform='scaleX(1)';}
          if(dx<0&&cs.facing!==-1){cs.facing=-1;catFlip.style.transform='scaleX(-1)';}
        }

        // Vertical physics
        if(!cs.onGround){
          cs.velY+=GRAVITY;
          cs.y+=cs.velY;
          const gy=groundY();
          if(cs.y>=gy){cs.y=gy;cs.velY=0;cs.onGround=true;}
          catWrap.style.top=cs.y+'px';
        }

        // Determine state and trigger animation on change
        const crouching=keys['ArrowDown']&&cs.onGround;
        const st=!cs.onGround?'jump':crouching?'crouch':dx!==0?'walk':'idle';
        if(st!==prevState){
          prevState=st;
          if(st==='jump'||st==='walk'||st==='crouch'){ playAnim(st); }
          else{ clearInterval(cs.timer);cs.frame=0;catEl.style.backgroundPosition=bgPos(0,ROWS.walk); }
        }
      }
      requestAnimationFrame(catLoop);
    }

    // D-pad pointer events → inject into keyboard keys map
    document.querySelectorAll('.dpad-btn').forEach(btn=>{
      const k=btn.dataset.key;
      const press=e=>{e.preventDefault();keys[k]=true; btn.classList.add('pressed');};
      const release=()=>{keys[k]=false;btn.classList.remove('pressed');};
      btn.addEventListener('pointerdown',press);
      btn.addEventListener('pointerup',release);
      btn.addEventListener('pointercancel',release);
      btn.addEventListener('pointerleave',release);
    });

    catReset();
    catWrap.classList.add('cat-on');
    catHintEl.classList.add('cat-on');
    dpadEl.classList.add('cat-on');
    requestAnimationFrame(catLoop);
  </script>
</body>
</html>
