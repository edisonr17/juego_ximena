<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cat Platformer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #030A14;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Inter', system-ui, sans-serif;
    gap: 14px;
    overflow: hidden;
  }

  h1 {
    color: rgba(46,117,182,0.7);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  canvas {
    display: block;
    border-radius: 12px;
    border: 1px solid #1a3a5c;
    max-width: 100%;
    height: auto;
    box-shadow: 0 0 48px rgba(46,117,182,0.12);
  }

  /* ── D-pad ── */
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 60px);
    grid-template-rows: repeat(2, 60px);
    gap: 8px;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  .dpad-btn {
    width: 60px; height: 60px;
    background: rgba(14,30,52,0.80);
    border: 1.5px solid rgba(46,117,182,0.45);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    color: rgba(226,232,240,0.75);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background .1s, border-color .1s, color .1s;
  }

  .dpad-btn.pressed {
    background: rgba(46,117,182,0.55);
    border-color: rgba(46,117,182,0.9);
    color: #fff;
  }

  /* grid positions: row1=[jump], row2=[← ↓ →] */
  .dpad-jump  { grid-column: 2; grid-row: 1; font-size: 20px; }
  .dpad-left  { grid-column: 1; grid-row: 2; }
  .dpad-down  { grid-column: 2; grid-row: 2; }
  .dpad-right { grid-column: 3; grid-row: 2; }

  @media (min-width: 700px) {
    .dpad { display: none; }   /* hide on desktop — use keyboard */
  }
</style>
</head>
<body>
<h1>Cat Platformer</h1>
<canvas id="gameCanvas" width="800" height="460"></canvas>

<div class="dpad">
  <button class="dpad-btn dpad-jump"  data-code="ArrowUp"    >↑</button>
  <button class="dpad-btn dpad-left"  data-code="ArrowLeft"  >←</button>
  <button class="dpad-btn dpad-down"  data-code="ArrowDown"  >↓</button>
  <button class="dpad-btn dpad-right" data-code="ArrowRight" >→</button>
</div>

<script src="game.js"></script>
<script>
  document.querySelectorAll('.dpad-btn').forEach(btn => {
    const code = btn.dataset.code;

    const press = e => {
      e.preventDefault();
      btn.classList.add('pressed');
      window.dispatchEvent(new KeyboardEvent('keydown', { code, bubbles: true }));
    };
    const release = () => {
      btn.classList.remove('pressed');
      window.dispatchEvent(new KeyboardEvent('keyup', { code, bubbles: true }));
    };

    btn.addEventListener('pointerdown', press);
    btn.addEventListener('pointerup',     release);
    btn.addEventListener('pointercancel', release);
    btn.addEventListener('pointerleave',  release);
  });
</script>
</body>
</html>
